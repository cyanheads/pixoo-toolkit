name: Bug Report
description: Report a bug in @cyanheads/pixoo-toolkit
labels: ["bug"]
assignees: ["cyanheads"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug in `@cyanheads/pixoo-toolkit`.

        **Do not include secrets, credentials, device identifiers, private IP addresses, or other sensitive data.** Replace local addresses with placeholders such as `<device-ip>` and redact logs before submitting. GitHub issues are public.

  - type: input
    id: version
    attributes:
      label: Toolkit version
      placeholder: "0.6.1"
    validations:
      required: true

  - type: dropdown
    id: runtime
    attributes:
      label: Runtime
      options:
        - Bun
        - Node.js
        - Browser or bundler
        - Other
    validations:
      required: true

  - type: input
    id: runtime-version
    attributes:
      label: Runtime version
      placeholder: "Bun 1.3.x / Node.js 22.x"
    validations:
      required: true

  - type: dropdown
    id: subsystem
    attributes:
      label: Subsystem
      options:
        - Canvas and drawing
        - Color
        - Bitmap fonts
        - Image and sprites
        - Animation
        - PNG or GIF export
        - SVG paths
        - PixooClient
        - Packaging or types
        - Other
    validations:
      required: true

  - type: dropdown
    id: device
    attributes:
      label: Device model
      options:
        - Not device-related
        - Pixoo-16
        - Pixoo-32
        - Pixoo-64
        - Other Divoom device
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS
      placeholder: "macOS 15.x / Ubuntu 24.04 / Windows 11"

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal code that reproduces the issue without private device or network details.
      render: typescript
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Error messages, stack traces, or incorrect output.
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Firmware version, workarounds, related issues, or other relevant details.
