name: Bug Report
description: Report a bug in @cyanheads/pixoo-toolkit
labels: ["bug"]
assignees: ["cyanheads"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Drawing, font, image, and PNG/GIF bugs reproduce without a device — a repro that never calls `PixooClient` is the fastest to fix. If the display misbehaves the same way from the Divoom app, the cause is likely firmware rather than the toolkit.

        **Do not include secrets, device identifiers, private IP addresses, or other sensitive data.** Replace device addresses with `<device-ip>` or `192.0.2.1` and redact logs before submitting. GitHub issues are public and permanent.

        **Secondary labels.** `bug` is applied automatically — also add one or more of the following in the sidebar if they apply:
        - `regression` — worked before, broken after an update
        - `performance` — memory, CPU, latency, or resource usage
        - `security` — vulnerability, CVE, or hardening work
        - `breaking-change` — fix will break public API
        - `surplus-token-idea` — worth exploring when token budget allows

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: "Replace the second row. pixoo-toolkit: the installed version, not the ^ range. Runtime: Bun, Node.js, or a browser bundle, with its version. Device: the Pixoo model, or none when no device is involved. OS is optional."
      value: |
        | pixoo-toolkit | Runtime | Device | OS |
        |---|---|---|---|
        | 0.x.y | Bun 1.4.x | Pixoo-64 | macOS 15.x |
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened and what you expected instead — two or three sentences.
      placeholder: "drawText clips the last glyph of a string that measureText says fits the row."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal code to reproduce the issue, without private device or network details.
      render: typescript
      placeholder: |
        import { Canvas, drawText, measureText } from '@cyanheads/pixoo-toolkit';

        const canvas = new Canvas(64);
        const text = 'HELLO WORLD';
        console.log(measureText(text));
        drawText(canvas, text, 0, 0, '#ffffff');
        console.log(canvas.getPixel(63, 3));
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Error messages, stack traces, or incorrect output.
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Only what changes the fix — firmware version, a workaround, a related issue, the one log line that matters.
    validations:
      required: false
